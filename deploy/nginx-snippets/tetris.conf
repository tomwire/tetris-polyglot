# Tetris Polyglot — Nginx Configuration for homelab
# Place in /etc/nginx/conf.d/snippets/ or include from main server block

server {
    listen 443 ssl;
    server_name tetris.thomaswire.com;
    
    include snippets/certbot-dns-route53.conf; # wildcard cert
    
    # Authelia integration
    include snippets/authelia-endpoint.conf;
    
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /ws/go-engine {
        proxy_pass http://go-engine:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Health check endpoint (unprotected for monitoring)
server {
    listen 443 ssl;
    server_name tetris-health.thomaswire.com;
    
    include snippets/certbot-dns-route53.conf;
    
    location /health {
        proxy_pass http://frontend:8080/health;
    }
}
