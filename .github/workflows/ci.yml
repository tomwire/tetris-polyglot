# Polyglot Tetris — CI Pipeline
# Each engine job mirrors exactly what its Dockerfile does (build + test where
# tests exist). Lockfiles (package-lock.json, Cargo.lock) are intentionally
# gitignored, so no job depends on a committed lockfile or lockfile-keyed cache.

name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Go Engine  (mirrors engines/go/Dockerfile: golang:1.22-alpine)
  # ──────────────────────────────────────────────
  go-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('engines/go/go.sum') }}

      - name: Vet
        working-directory: engines/go
        run: go vet ./...

      - name: Test (race detector)
        working-directory: engines/go
        run: go test -v -race -coverprofile=coverage.out ./internal/...

      - name: Build binary
        working-directory: engines/go
        run: CGO_ENABLED=0 GOOS=linux go build -o tetris-engine ./cmd/server

  # ──────────────────────────────────────────────
  # Rust Engine  (mirrors engines/rust/Dockerfile: rust:1.75-bookworm, cargo build --release)
  # ──────────────────────────────────────────────
  rust-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            engines/rust/target
          key: ${{ runner.os }}-rust-${{ hashFiles('engines/rust/Cargo.toml') }}

      - name: Test
        working-directory: engines/rust
        run: cargo test --release

      - name: Build release binary
        working-directory: engines/rust
        run: cargo build --release

  # ──────────────────────────────────────────────
  # Node.js Engine  (mirrors engines/node/Dockerfile: node:22-slim, npm install + tsc)
  # ──────────────────────────────────────────────
  node-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install deps
        working-directory: engines/node
        run: npm install

      - name: Build (tsc)
        working-directory: engines/node
        run: npx tsc -p tsconfig.json

  # ──────────────────────────────────────────────
  # Python Engine
  # ──────────────────────────────────────────────
  python-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install deps + tooling
        working-directory: engines/python
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: engines/python
        run: ruff check src/ tests/ || true  # non-fatal for now

      - name: Typecheck (mypy)
        working-directory: engines/python
        run: mypy src/ --ignore-missing-imports || true

      - name: Test
        working-directory: engines/python
        run: python -m pytest tests/ -v --tb=short || true  # non-fatal until tests written

  # ──────────────────────────────────────────────
  # Frontend  (mirrors frontend/Dockerfile.prod: node:22-slim, npm install + vite build)
  # ──────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install deps
        working-directory: frontend
        run: npm install

      - name: Build (Vite)
        working-directory: frontend
        run: npx vite build --base=/

  # ──────────────────────────────────────────────
  # Docker builds (validate all engine images compile)
  # ──────────────────────────────────────────────
  docker-builds:
    runs-on: ubuntu-latest
    needs: [go-engine, rust-engine, node-engine, python-engine]
    strategy:
      matrix:
        engine: [go, rust, node, python]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image — ${{ matrix.engine }}
        working-directory: engines/${{ matrix.engine }}
        run: docker build -t tetris-${{ matrix.engine }} .
